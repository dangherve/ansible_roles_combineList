- name: Initialize temporary list
  set_fact:
    combineList2_result: []

- name: Combine lists
  set_fact:
    combineList2_result: >-
      {{
        combineList2_result +
        (
          vars[liste2]
          | selectattr('name', 'equalto', item.name)
          | map('combine', item)
          | list
        )
      }}
  loop: "{{ vars[liste1] }}"

- name: Set requested output variable
  set_fact:
    "{{ outputList }}": "{{ combineList2_result }}"
